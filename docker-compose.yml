services:
  finance-tracker:
    build: .
    container_name: lifetime-finance-tracker
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET}
      DB_PATH: /app/data/finance.db
      TRUST_PROXY: 0
    volumes:
      - finance_data:/app/data
      - ./backups:/app/backups
volumes:
  finance_data:
